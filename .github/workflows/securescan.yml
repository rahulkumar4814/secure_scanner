# SecureScan AI - runs on every push (and PR). Fails the build on Critical findings,
# uploads SARIF to GitHub code scanning and the JSON/PDF reports as build artifacts.
#
# Use in ANOTHER repository: copy this file and set the repository variable SECURESCAN_REPO to the
# git URL of the SecureScan project (or vendor SecureScan into ./securescan-tool).
name: SecureScan AI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # least privilege
  security-events: write  # upload SARIF

concurrency:
  group: securescan-${{ github.ref }}
  cancel-in-progress: true

env:
  FAIL_ON: critical                                   # critical | high | medium | low | none
  SECURESCAN_MODEL: ${{ vars.SECURESCAN_MODEL }}      # optional, e.g. llama3.2:3b (empty = no LLM)
  SECURESCAN_EXCLUDE_DIRS: ${{ vars.SECURESCAN_EXCLUDE_DIRS || 'samples,tests' }}

jobs:
  securescan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code to scan
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get SecureScan AI
        env:
          SECURESCAN_REPO: ${{ vars.SECURESCAN_REPO }}
        run: |
          if [ -f securescan/cli.py ]; then
            echo "SECURESCAN_HOME=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"          # scanning SecureScan itself
          else
            git clone --depth 1 "$SECURESCAN_REPO" "$RUNNER_TEMP/securescan-tool"
            echo "SECURESCAN_HOME=$RUNNER_TEMP/securescan-tool" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.SECURESCAN_HOME }}/requirements.txt

      - name: Install SecureScan + scanners
        run: |
          pip install -r "$SECURESCAN_HOME/requirements.txt"
          sudo BIN_DIR=/usr/local/bin bash "$SECURESCAN_HOME/scripts/install_tools.sh"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Start Ollama (only if a model is configured)
        if: env.SECURESCAN_MODEL != ''
        run: |
          # pinned container image instead of piping an install script into a shell
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.35.1
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 2; done
          docker exec ollama ollama pull "$SECURESCAN_MODEL"

      - name: Run SecureScan AI
        working-directory: ${{ env.SECURESCAN_HOME }}
        run: |
          MODEL_ARGS="--no-llm"
          [ -n "$SECURESCAN_MODEL" ] && MODEL_ARGS="--model $SECURESCAN_MODEL"
          python -m securescan.cli scan "$GITHUB_WORKSPACE" $MODEL_ARGS \
            --fail-on "$FAIL_ON" --out "$GITHUB_WORKSPACE/securescan-reports"

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('securescan-reports/securescan-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: securescan-reports/securescan-report.sarif
          category: securescan-ai

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: securescan-reports
          path: securescan-reports/
          retention-days: 30
